<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Sports Party! ⚽🏈🏀</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka for playful kid typography -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Vibrant animations */
    @keyframes pulse-grow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .animate-pulse-grow {
      animation: pulse-grow 1.8s infinite ease-in-out;
    }

    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-bounce-gentle {
      animation: bounce-gentle 1.2s infinite ease-in-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .animate-wiggle {
      animation: wiggle 0.6s infinite ease-in-out;
    }

    /* Giant responsive game buttons with deep kid-friendly shadows */
    .btn-super {
      box-shadow: 0 10px 0 0 rgba(0,0,0,0.25), inset 0 4px 0 0 rgba(255,255,255,0.4);
      transition: all 0.1s ease;
    }
    .btn-super:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 0 rgba(0,0,0,0.25), inset 0 2px 0 0 rgba(255,255,255,0.4);
    }

    canvas {
      image-rendering: pixelated;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-white overflow-hidden select-none">

  <!-- MAIN WRAPPER -->
  <div class="relative w-screen h-screen flex flex-col justify-between items-center overflow-hidden bg-gradient-to-b from-sky-400 via-indigo-500 to-purple-600">

    <!-- TOP NAVIGATION & HUD BAR -->
    <header class="w-full p-3 sm:p-4 flex justify-between items-center z-30 pointer-events-auto">
      <!-- Left Controls: Menu & Sound -->
      <div class="flex items-center gap-2 sm:gap-4">
        <button id="homeBtn" class="hidden bg-yellow-400 hover:bg-yellow-300 text-yellow-950 font-bold px-3 py-2 sm:px-4 sm:py-3 rounded-2xl btn-super flex items-center gap-2 text-lg sm:text-2xl">
          🏠 <span class="hidden sm:inline">Menu</span>
        </button>
        <button id="soundBtn" class="bg-purple-400 hover:bg-purple-300 text-purple-950 font-bold px-3 py-2 sm:px-4 sm:py-3 rounded-2xl btn-super text-lg sm:text-2xl flex items-center gap-1">
          <span id="soundIcon">🔊</span>
          <span id="soundLabel" class="text-sm font-semibold hidden sm:inline">Sound ON</span>
        </button>
      </div>

      <!-- Center Title Display (Active Game Name) -->
      <div id="gameTitleDisplay" class="bg-white/20 backdrop-blur-md px-4 py-1.5 sm:px-6 sm:py-2 rounded-full border-2 border-white/40 shadow-lg text-center">
        <h1 id="activeGameText" class="text-lg sm:text-3xl font-extrabold tracking-wide drop-shadow text-yellow-300">
          Super Sports Party! 🌟
        </h1>
      </div>

      <!-- Right Display: Stars Counter -->
      <div class="bg-yellow-400 text-yellow-950 px-3 py-1.5 sm:px-5 sm:py-2 rounded-full font-extrabold text-lg sm:text-3xl flex items-center gap-2 border-4 border-yellow-200 shadow-lg animate-pulse-grow">
        <span class="text-2xl sm:text-4xl">⭐</span>
        <span id="starCounter">0</span>
      </div>
    </header>

    <!-- GAME CANVAS CONTAINER -->
    <div class="relative flex-1 w-full flex items-center justify-center p-2 z-10 overflow-hidden">
      <canvas id="gameCanvas" class="w-full h-full max-w-5xl max-h-[80vh] rounded-3xl shadow-2xl bg-sky-200 border-4 sm:border-8 border-white/80"></canvas>

      <!-- HOME MENU OVERLAY -->
      <div id="homeMenu" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-4 bg-gradient-to-b from-sky-400/90 to-indigo-600/90 backdrop-blur-sm overflow-y-auto">
        <div class="text-center mb-6 sm:mb-8 animate-bounce-gentle">
          <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold text-yellow-300 drop-shadow-[0_6px_0_rgba(0,0,0,0.3)] tracking-wider">
            SUPER SPORTS!
          </h1>
          <p class="text-lg sm:text-2xl text-white font-semibold drop-shadow mt-1">
            Pick a sport and let's play! 🎈
          </p>
        </div>

        <!-- Mini-Game Selection Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 w-full max-w-5xl px-4">
          <!-- Soccer Card -->
          <button onclick="startGame('soccer')" class="bg-gradient-to-b from-green-400 to-emerald-600 hover:from-green-300 hover:to-emerald-500 border-4 border-white rounded-3xl p-5 flex flex-col items-center justify-between text-center btn-super transform hover:scale-105 transition">
            <div class="text-6xl sm:text-8xl mb-2 animate-wiggle">⚽</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow">SOCCER</h2>
            <p class="text-sm sm:text-base text-green-100 font-medium mt-1">Kick Goals into the Net! 🥅</p>
            <span class="mt-4 bg-yellow-400 text-yellow-950 px-5 py-2 rounded-full font-extrabold text-lg sm:text-xl shadow">PLAY! ▶</span>
          </button>

          <!-- Football Card -->
          <button onclick="startGame('football')" class="bg-gradient-to-b from-amber-500 to-orange-700 hover:from-amber-400 hover:to-orange-600 border-4 border-white rounded-3xl p-5 flex flex-col items-center justify-between text-center btn-super transform hover:scale-105 transition">
            <div class="text-6xl sm:text-8xl mb-2 animate-wiggle">🏈</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow">FOOTBALL</h2>
            <p class="text-sm sm:text-base text-amber-100 font-medium mt-1">Throw for a Touchdown! 🏆</p>
            <span class="mt-4 bg-yellow-400 text-yellow-950 px-5 py-2 rounded-full font-extrabold text-lg sm:text-xl shadow">PLAY! ▶</span>
          </button>

          <!-- Basketball Card -->
          <button onclick="startGame('basketball')" class="bg-gradient-to-b from-orange-400 to-red-600 hover:from-orange-300 hover:to-red-500 border-4 border-white rounded-3xl p-5 flex flex-col items-center justify-between text-center btn-super transform hover:scale-105 transition">
            <div class="text-6xl sm:text-8xl mb-2 animate-wiggle">🏀</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow">BASKETBALL</h2>
            <p class="text-sm sm:text-base text-orange-100 font-medium mt-1">Tap to Bounce & Score! 🏀🔥</p>
            <span class="mt-4 bg-yellow-400 text-yellow-950 px-5 py-2 rounded-full font-extrabold text-lg sm:text-xl shadow">PLAY! ▶</span>
          </button>

          <!-- Baseball Card -->
          <button onclick="startGame('baseball')" class="bg-gradient-to-b from-red-500 to-rose-700 hover:from-red-400 hover:to-rose-600 border-4 border-white rounded-3xl p-5 flex flex-col items-center justify-between text-center btn-super transform hover:scale-105 transition">
            <div class="text-6xl sm:text-8xl mb-2 animate-wiggle">⚾</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow">BASEBALL</h2>
            <p class="text-sm sm:text-base text-red-100 font-medium mt-1">Tap to Swing for Home Runs! 💥</p>
            <span class="mt-4 bg-yellow-400 text-yellow-950 px-5 py-2 rounded-full font-extrabold text-lg sm:text-xl shadow">PLAY! ▶</span>
          </button>
        </div>

        <!-- Toddler Instructions -->
        <div class="mt-6 bg-white/20 backdrop-blur-md px-6 py-3 rounded-2xl text-center max-w-md border border-white/30">
          <p class="text-sm sm:text-base font-medium text-white">
            🎮 <b>Controls:</b> Tap screen or big button / press <span class="bg-yellow-400 text-yellow-950 px-2 py-0.5 rounded font-bold">SPACE</span> to play!
          </p>
        </div>
      </div>
    </div>

    <!-- IN-GAME TOUCH CONTROL OVERLAY (Giant Buttons for Ages 3-5) -->
    <footer id="gameControls" class="hidden w-full max-w-4xl p-3 sm:p-4 z-30 flex items-center justify-between gap-3 pointer-events-auto">
      <!-- Aim Left Button -->
      <button id="btnLeft" class="bg-blue-500 hover:bg-blue-400 active:bg-blue-600 text-white font-extrabold text-3xl sm:text-5xl p-4 sm:p-6 rounded-3xl btn-super flex-1 flex items-center justify-center border-4 border-white">
        ⬅️
      </button>

      <!-- Giant Main Action Button (Kick / Throw / Shoot) -->
      <button id="btnAction" class="bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-white font-extrabold text-2xl sm:text-4xl py-5 sm:py-7 px-6 sm:px-10 rounded-3xl btn-super flex-[2.5] flex items-center justify-center gap-2 border-4 border-white animate-pulse-grow">
        <span id="actionIcon" class="text-3xl sm:text-5xl">⚽</span>
        <span id="actionText">KICK!</span>
      </button>

      <!-- Aim Right Button -->
      <button id="btnRight" class="bg-blue-500 hover:bg-blue-400 active:bg-blue-600 text-white font-extrabold text-3xl sm:text-5xl p-4 sm:p-6 rounded-3xl btn-super flex-1 flex items-center justify-center border-4 border-white">
        ➡️
      </button>
    </footer>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ===================================================================
       1. CORE INITIALIZATION & CANVAS RESIZING
       =================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const homeMenu = document.getElementById('homeMenu');
    const homeBtn = document.getElementById('homeBtn');
    const soundBtn = document.getElementById('soundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');
    const activeGameText = document.getElementById('activeGameText');
    const starCounter = document.getElementById('starCounter');
    const gameControls = document.getElementById('gameControls');
    const btnLeft = document.getElementById('btnLeft');
    const btnAction = document.getElementById('btnAction');
    const btnRight = document.getElementById('btnRight');
    const actionIcon = document.getElementById('actionIcon');
    const actionText = document.getElementById('actionText');

    let currentMode = 'MENU';
    const keyState = { left: false, right: false, action: false };

    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth || 800;
      canvas.height = container.clientHeight || 500;
    }
    window.addEventListener('resize', resizeCanvas);


    /* ===================================================================
       2. WEB AUDIO SYNTHESIZER ENGINE (No External Audio Files)
       =================================================================== */
    const sound = {
      ctx: null,
      muted: false,

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      },

      playTone(freq, duration, type = 'sine', gainVal = 0.2) {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },

      playWhistle() {
        if (this.muted || !this.ctx) return;
        this.playTone(2200, 0.25, 'sine', 0.2);
        setTimeout(() => this.playTone(2600, 0.35, 'sine', 0.25), 100);
      },

      playBounce() {
        if (this.muted || !this.ctx) return;
        this.playTone(180, 0.12, 'triangle', 0.3);
      },

      playSwish() {
        if (this.muted || !this.ctx) return;
        this.playTone(800, 0.1, 'sine', 0.2);
        setTimeout(() => this.playTone(1200, 0.15, 'triangle', 0.25), 50);
      },

      playHit() {
        if (this.muted || !this.ctx) return;
        this.playTone(600, 0.15, 'square', 0.3);
        setTimeout(() => this.playTone(1000, 0.2, 'sine', 0.3), 40);
      },

      playCheer() {
        if (this.muted || !this.ctx) return;
        const notes = [400, 523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.3, 'sine', 0.25), idx * 80);
        });
      },

      playHorn() {
        if (this.muted || !this.ctx) return;
        this.playTone(300, 0.5, 'sawtooth', 0.25);
      }
    };


    /* ===================================================================
       3. PARTICLES & CELEBRATION ENGINE
       =================================================================== */
    let starsCount = 0;
    let particles = [];
    let celebrationBanner = { text: '', alpha: 0, scale: 1, timer: 0 };

    function createCelebration(text) {
      starsCount += 1;
      starCounter.innerText = starsCount;
      celebrationBanner.text = text;
      celebrationBanner.alpha = 1.0;
      celebrationBanner.scale = 0.5;
      celebrationBanner.timer = 90;
      sound.playCheer();

      // Burst confetti
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 100,
          y: canvas.height * 0.4 + (Math.random() - 0.5) * 100,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12 - 4,
          size: Math.random() * 12 + 6,
          color: ['#facc15', '#4ade80', '#f43f5e', '#38bdf8', '#c084fc', '#fb923c'][Math.floor(Math.random() * 6)],
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.2,
          gravity: 0.25,
          life: 90
        });
      }
    }

    function updateAndDrawParticles() {
      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity || 0;
        p.rotation += p.vRot || 0;
        p.life--;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }

      // Draw Celebration Banner Overlay
      if (celebrationBanner.timer > 0) {
        celebrationBanner.timer--;
        celebrationBanner.alpha = Math.min(1, celebrationBanner.timer / 20);
        if (celebrationBanner.scale < 1) celebrationBanner.scale += 0.05;

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height * 0.35);
        ctx.scale(celebrationBanner.scale, celebrationBanner.scale);
        ctx.globalAlpha = celebrationBanner.alpha;

        // Glowing backdrop box
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.roundRect(-220, -45, 440, 90, 24);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.font = '900 32px Fredoka, cursive, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(celebrationBanner.text, 0, 0);

        ctx.restore();
      }
    }


    /* ===================================================================
       4. MINI-GAME 1: SOCCER GOAL STRIKER ⚽
       =================================================================== */
    const soccerGame = {
      ball: { x: 0, y: 0, scale: 1, vx: 0, vy: 0, vScale: 0, state: 'ready' },
      keeper: { x: 0, dir: 1, speed: 2.5 },
      aimAngle: 0,

      reset() {
        this.ball.x = canvas.width / 2;
        this.ball.y = canvas.height * 0.82;
        this.ball.scale = 1.0;
        this.ball.vx = 0;
        this.ball.vy = 0;
        this.ball.vScale = 0;
        this.ball.state = 'ready';
        this.aimAngle = 0;
        this.keeper.x = canvas.width / 2;
      },

      moveLeft() { if (this.ball.state === 'ready') this.aimAngle = Math.max(-0.8, this.aimAngle - 0.15); },
      moveRight() { if (this.ball.state === 'ready') this.aimAngle = Math.min(0.8, this.aimAngle + 0.15); },

      action() {
        if (this.ball.state === 'ready') {
          this.ball.state = 'flying';
          this.ball.vx = Math.sin(this.aimAngle) * 12;
          this.ball.vy = -11;
          this.ball.vScale = -0.012;
          sound.playBounce();
        }
      },

      update() {
        // Move Keeper
        this.keeper.x += this.keeper.dir * this.keeper.speed;
        const goalWidth = canvas.width * 0.55;
        const netLeft = canvas.width / 2 - goalWidth / 2 + 40;
        const netRight = canvas.width / 2 + goalWidth / 2 - 40;

        if (this.keeper.x < netLeft || this.keeper.x > netRight) {
          this.keeper.dir *= -1;
        }

        // Move Ball
        if (this.ball.state === 'flying') {
          this.ball.x += this.ball.vx;
          this.ball.y += this.ball.vy;
          this.ball.scale = Math.max(0.4, this.ball.scale + this.ball.vScale);

          // Reached Net Depth
          if (this.ball.y <= canvas.height * 0.32) {
            const keeperDist = Math.abs(this.ball.x - this.keeper.x);

            if (this.ball.x > netLeft && this.ball.x < netRight && keeperDist > 45) {
              // GOAL!
              this.ball.state = 'scored';
              createCelebration('GOAAAL! ⚽ SUPER KICK!');
              setTimeout(() => this.reset(), 1200);
            } else {
              // Save / Miss - friendly soft retry
              this.ball.state = 'saved';
              sound.playBounce();
              setTimeout(() => this.reset(), 900);
            }
          }
        }
      },

      draw() {
        // Field Grass
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Lawn Stripes
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        for (let i = 0; i < canvas.height; i += 60) {
          if (Math.floor(i / 60) % 2 === 0) {
            ctx.fillRect(0, i, canvas.width, 30);
          }
        }

        // Goal Net
        const goalW = canvas.width * 0.55;
        const goalH = canvas.height * 0.28;
        const goalX = (canvas.width - goalW) / 2;
        const goalY = canvas.height * 0.12;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(goalX, goalY, goalW, goalH);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 8;
        ctx.strokeRect(goalX, goalY, goalW, goalH);

        // Net Mesh Lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        for (let x = goalX; x <= goalX + goalW; x += 20) {
          ctx.beginPath(); ctx.moveTo(x, goalY); ctx.lineTo(x, goalY + goalH); ctx.stroke();
        }
        for (let y = goalY; y <= goalY + goalH; y += 20) {
          ctx.beginPath(); ctx.moveTo(goalX, y); ctx.lineTo(goalX + goalW, y); ctx.stroke();
        }

        // Bear Goalie 🐻
        ctx.save();
        ctx.translate(this.keeper.x, goalY + goalH - 10);
        ctx.fillStyle = '#854d0e';
        ctx.beginPath(); ctx.arc(0, -25, 25, 0, Math.PI * 2); ctx.fill(); // Head
        ctx.beginPath(); ctx.arc(-20, -42, 10, 0, Math.PI * 2); ctx.fill(); // Ear L
        ctx.beginPath(); ctx.arc(20, -42, 10, 0, Math.PI * 2); ctx.fill(); // Ear R
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(0, -18, 12, 0, Math.PI * 2); ctx.fill(); // Snout
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(-8, -28, 3, 0, Math.PI * 2); ctx.arc(8, -28, 3, 0, Math.PI * 2); ctx.fill(); // Eyes
        ctx.beginPath(); ctx.arc(0, -20, 4, 0, Math.PI * 2); ctx.fill(); // Nose
        ctx.restore();

        // Aim Line
        if (this.ball.state === 'ready') {
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 6;
          ctx.setLineDash([10, 10]);
          ctx.beginPath();
          ctx.moveTo(this.ball.x, this.ball.y);
          ctx.lineTo(this.ball.x + Math.sin(this.aimAngle) * 120, this.ball.y - Math.cos(this.aimAngle) * 120);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Soccer Ball
        ctx.save();
        ctx.translate(this.ball.x, this.ball.y);
        ctx.scale(this.ball.scale, this.ball.scale);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    };


    /* ===================================================================
       5. MINI-GAME 2: FOOTBALL TOUCHDOWN TOSS 🏈
       =================================================================== */
    const footballGame = {
      ball: { x: 0, y: 0, scale: 1, vx: 0, vy: 0, state: 'ready', rot: 0 },
      receiver: { x: 0, dir: 1, speed: 3.2 },
      aimAngle: 0,

      reset() {
        this.ball.x = canvas.width / 2;
        this.ball.y = canvas.height * 0.82;
        this.ball.scale = 1.0;
        this.ball.vx = 0;
        this.ball.vy = 0;
        this.ball.state = 'ready';
        this.ball.rot = 0;
        this.aimAngle = 0;
        this.receiver.x = canvas.width * 0.2;
      },

      moveLeft() { if (this.ball.state === 'ready') this.aimAngle = Math.max(-0.8, this.aimAngle - 0.15); },
      moveRight() { if (this.ball.state === 'ready') this.aimAngle = Math.min(0.8, this.aimAngle + 0.15); },

      action() {
        if (this.ball.state === 'ready') {
          this.ball.state = 'flying';
          this.ball.vx = Math.sin(this.aimAngle) * 11;
          this.ball.vy = -10.5;
          sound.playBounce();
        }
      },

      update() {
        // Receiver Running Across Field
        this.receiver.x += this.receiver.dir * this.receiver.speed;
        if (this.receiver.x < canvas.width * 0.15 || this.receiver.x > canvas.width * 0.85) {
          this.receiver.dir *= -1;
        }

        if (this.ball.state === 'flying') {
          this.ball.x += this.ball.vx;
          this.ball.y += this.ball.vy;
          this.ball.scale = Math.max(0.45, this.ball.scale - 0.011);
          this.ball.rot += 0.25;

          if (this.ball.y <= canvas.height * 0.28) {
            const catchDist = Math.abs(this.ball.x - this.receiver.x);
            if (catchDist < 55) {
              this.ball.state = 'caught';
              sound.playHorn();
              createCelebration('TOUCHDOWN! 🏈 AMAZING TOSS!');
              setTimeout(() => this.reset(), 1200);
            } else {
              this.ball.state = 'missed';
              sound.playBounce();
              setTimeout(() => this.reset(), 800);
            }
          }
        }
      },

      draw() {
        // Football Field Turf
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Yard Lines
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        for (let y = canvas.height * 0.15; y < canvas.height; y += 70) {
          ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(canvas.width - 30, y); ctx.stroke();
        }

        // Yellow Goal Post at Top
        const postX = canvas.width / 2;
        const postY = canvas.height * 0.18;
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(postX, postY + 60); ctx.lineTo(postX, postY);
        ctx.moveTo(postX - 80, postY); ctx.lineTo(postX + 80, postY);
        ctx.moveTo(postX - 80, postY); ctx.lineTo(postX - 80, postY - 50);
        ctx.moveTo(postX + 80, postY); ctx.lineTo(postX + 80, postY - 50);
        ctx.stroke();

        // Running Receiver Mascot 🦊
        ctx.save();
        ctx.translate(this.receiver.x, canvas.height * 0.26);
        ctx.fillStyle = '#ea580c';
        ctx.beginPath(); ctx.arc(0, -20, 20, 0, Math.PI * 2); ctx.fill(); // Head
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(-6, -22, 4, 0, Math.PI * 2); ctx.arc(6, -22, 4, 0, Math.PI * 2); ctx.fill(); // Eyes
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(-6, -22, 2, 0, Math.PI * 2); ctx.arc(6, -22, 2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // Football
        ctx.save();
        ctx.translate(this.ball.x, this.ball.y);
        ctx.scale(this.ball.scale, this.ball.scale);
        ctx.rotate(this.ball.rot);
        ctx.fillStyle = '#78350f';
        ctx.beginPath(); ctx.ellipse(0, 0, 26, 16, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        // Laces
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
        ctx.restore();
      }
    };


    /* ===================================================================
       6. MINI-GAME 3: BASKETBALL HOOPS 🏀 (TAP TAP SHOTS ARCADE STYLE)
       =================================================================== */
    const basketballGame = {
      ball: { x: 0, y: 0, vx: 0, vy: 0, radius: 24, trail: [], isOnFire: false },
      hoop: { x: 0, y: 0, radius: 36, dirY: 1, speedY: 1.2 },
      backboard: { x: 0, y: 0, width: 14, height: 110 },
      pointsScored: 0,
      swishStreak: 0,
      shotTimer: 100,
      hasPassedHoop: false,

      resetBall() {
        this.ball.x = canvas.width * 0.2;
        this.ball.y = canvas.height * 0.55;
        this.ball.vx = 0;
        this.ball.vy = 0;
        this.ball.trail = [];
        this.shotTimer = 100;
        this.hasPassedHoop = false;
      },

      reset() {
        this.pointsScored = 0;
        this.swishStreak = 0;
        this.hoop.x = canvas.width * 0.72;
        this.hoop.y = canvas.height * 0.45;
        this.resetBall();
      },

      tapShoot() {
        this.ball.vy = -8.5;
        const targetDir = this.hoop.x > this.ball.x ? 1 : -1;
        this.ball.vx = targetDir * 3.8;
        sound.playBounce();
      },

      moveLeft() { this.ball.vx -= 2.0; },
      moveRight() { this.ball.vx += 2.0; },

      action() {
        this.tapShoot();
      },

      update() {
        if (this.shotTimer > 0) {
          this.shotTimer -= 0.18;
        } else {
          this.resetBall();
          this.swishStreak = 0;
          this.ball.isOnFire = false;
        }

        this.ball.vy += 0.38;
        this.ball.vx *= 0.96;

        const prevY = this.ball.y;
        this.ball.x += this.ball.vx;
        this.ball.y += this.ball.vy;

        // Trail effect
        this.ball.trail.push({ x: this.ball.x, y: this.ball.y, fire: this.ball.isOnFire });
        if (this.ball.trail.length > (this.ball.isOnFire ? 15 : 8)) this.ball.trail.shift();

        // Fire particles
        if (this.ball.isOnFire && Math.random() < 0.6) {
          particles.push({
            x: this.ball.x + (Math.random() - 0.5) * 20,
            y: this.ball.y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2 - 2,
            size: Math.random() * 8 + 4,
            color: Math.random() > 0.5 ? '#f97316' : '#facc15',
            rotation: 0,
            vRot: 0,
            gravity: -0.1,
            life: 20
          });
        }

        // Floor cushion
        const floorY = canvas.height - 40;
        if (this.ball.y > floorY - this.ball.radius) {
          this.ball.y = floorY - this.ball.radius;
          this.ball.vy = -5.5;
          sound.playBounce();
        }

        // Ceiling cushion
        if (this.ball.y < this.ball.radius + 10) {
          this.ball.y = this.ball.radius + 10;
          this.ball.vy = 2;
        }

        // Left wall bounce
        if (this.ball.x < this.ball.radius + 10) {
          this.ball.x = this.ball.radius + 10;
          this.ball.vx = Math.abs(this.ball.vx) * 0.8 + 2;
          sound.playBounce();
        }

        // Right wall bounce
        if (this.ball.x > canvas.width - this.ball.radius - 10) {
          this.ball.x = canvas.width - this.ball.radius - 10;
          this.ball.vx = -Math.abs(this.ball.vx) * 0.8 - 2;
          sound.playBounce();
        }

        // Backboard collision
        const bbX = this.hoop.x + this.hoop.radius + 10;
        const bbTop = this.hoop.y - 55;
        const bbBottom = this.hoop.y + 55;

        if (this.ball.x + this.ball.radius > bbX - 10 && this.ball.x - this.ball.radius < bbX + 15 &&
            this.ball.y > bbTop && this.ball.y < bbBottom) {
          this.ball.x = bbX - 10 - this.ball.radius;
          this.ball.vx = -Math.abs(this.ball.vx) * 0.75 - 2;
          sound.playBounce();
        }

        // Hoop motion
        this.hoop.y += this.hoop.dirY * this.hoop.speedY;
        if (this.hoop.y < 140 || this.hoop.y > canvas.height - 160) {
          this.hoop.dirY *= -1;
        }

        // Rim scoring entry
        const rimLeft = this.hoop.x - this.hoop.radius + 6;
        const rimRight = this.hoop.x + this.hoop.radius - 6;
        const rimY = this.hoop.y;

        const isHorizontallyInside = this.ball.x > rimLeft && this.ball.x < rimRight;
        const crossedRimFromAbove = prevY <= rimY + 5 && this.ball.y >= rimY - 5;

        if (isHorizontallyInside && crossedRimFromAbove && this.ball.vy > 0 && !this.hasPassedHoop) {
          this.hasPassedHoop = true;
          this.pointsScored++;
          this.swishStreak++;

          sound.playSwish();

          if (this.swishStreak >= 2) {
            this.ball.isOnFire = true;
            createCelebration(`🔥 ON FIRE! ${this.swishStreak}x STREAK! 🔥`);
          } else {
            createCelebration('SWISH! 🏀 TAP TAP SCORE!');
          }

          setTimeout(() => {
            this.hoop.y = 150 + Math.random() * (canvas.height - 300);
            this.resetBall();
          }, 700);
        }
      },

      draw() {
        ctx.fillStyle = '#ea580c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        // Shot Timer Bar
        const timerBarWidth = canvas.width * 0.6;
        const timerBarX = (canvas.width - timerBarWidth) / 2;
        const timerBarY = 25;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath(); ctx.roundRect(timerBarX, timerBarY, timerBarWidth, 18, 9); ctx.fill();

        const currentTimerWidth = (this.shotTimer / 100) * timerBarWidth;
        ctx.fillStyle = this.shotTimer > 30 ? '#4ade80' : '#f43f5e';
        ctx.beginPath(); ctx.roundRect(timerBarX, timerBarY, Math.max(0, currentTimerWidth), 18, 9); ctx.fill();

        // Score Billboard
        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.roundRect(canvas.width / 2 - 140, 55, 280, 50, 16); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.font = '900 22px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        const streakText = this.swishStreak > 1 ? ` 🔥 ${this.swishStreak}x` : '';
        ctx.fillText(`SCORE: ${this.pointsScored}${streakText}`, canvas.width / 2, 88);

        // Trail
        for (let i = 0; i < this.ball.trail.length; i++) {
          const pt = this.ball.trail[i];
          const ratio = (i + 1) / this.ball.trail.length;
          ctx.fillStyle = pt.fire ? `rgba(249, 115, 22, ${ratio * 0.7})` : `rgba(250, 204, 21, ${ratio * 0.4})`;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, this.ball.radius * (0.4 + ratio * 0.6), 0, Math.PI * 2); ctx.fill();
        }

        // Backboard & Net
        ctx.save();
        ctx.translate(this.hoop.x, this.hoop.y);

        const bbX = this.hoop.radius + 10;
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 6;
        ctx.fillRect(bbX, -55, 14, 110); ctx.strokeRect(bbX, -55, 14, 110);
        ctx.strokeRect(bbX, -25, 14, 50);

        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-this.hoop.radius + 4, 0); ctx.lineTo(-20, 50); ctx.lineTo(20, 50); ctx.lineTo(this.hoop.radius - 4, 0);
        ctx.moveTo(-12, 22); ctx.lineTo(12, 22);
        ctx.stroke();

        ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.ellipse(0, 0, this.hoop.radius, 12, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();

        // Player Basketball Ball
        ctx.save();
        ctx.translate(this.ball.x, this.ball.y);
        ctx.rotate(this.ball.x * 0.08);

        if (this.ball.isOnFire) {
          ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
          ctx.beginPath(); ctx.arc(0, 0, this.ball.radius + 8, 0, Math.PI * 2); ctx.fill();
        }

        ctx.fillStyle = this.ball.isOnFire ? '#f97316' : '#ea580c';
        ctx.beginPath(); ctx.arc(0, 0, this.ball.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.ball.radius, 0); ctx.lineTo(this.ball.radius, 0);
        ctx.moveTo(0, -this.ball.radius); ctx.lineTo(0, this.ball.radius);
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(-7, -5, 3, 0, Math.PI * 2); ctx.arc(7, -5, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 2, 7, 0, Math.PI); ctx.stroke();

        ctx.restore();
      }
    };


    /* ===================================================================
       6.5 MINI-GAME 4: BASEBALL HOME RUN HITTER ⚾
       =================================================================== */
    const baseballGame = {
      ball: { x: 0, y: 0, vx: 0, vy: 0, scale: 1, radius: 20, state: 'ready' },
      batter: { x: 0, y: 0, swingAngle: -0.3, isSwinging: false, swingTimer: 0 },
      pitchTimer: 0,

      reset() {
        this.ball.x = canvas.width * 0.3;
        this.ball.y = canvas.height * 0.35;
        this.ball.vx = 0;
        this.ball.vy = 0;
        this.ball.scale = 0.6;
        this.ball.state = 'pitching';
        this.batter.x = canvas.width * 0.75;
        this.batter.y = canvas.height * 0.75;
        this.batter.swingAngle = -0.3;
        this.batter.isSwinging = false;
        this.batter.swingTimer = 0;
        this.pitchTimer = 0;
      },

      moveLeft() {},
      moveRight() {},

      action() {
        if (!this.batter.isSwinging) {
          this.batter.isSwinging = true;
          this.batter.swingTimer = 18;
          sound.playBounce();

          // Check hit collision with generous hitbox for ages 3-5
          const plateX = this.batter.x - 30;
          const plateY = this.batter.y - 10;
          const distToPlate = Math.hypot(this.ball.x - plateX, this.ball.y - plateY);

          if (distToPlate < 75 && this.ball.state === 'pitching') {
            this.ball.state = 'hit';
            this.ball.vx = -12 - Math.random() * 4;
            this.ball.vy = -14 - Math.random() * 4;
            sound.playHit();
            createCelebration('HOME RUN! ⚾ BIG HIT!');
            setTimeout(() => this.reset(), 1400);
          }
        }
      },

      update() {
        // Pitching ball towards batter
        if (this.ball.state === 'pitching') {
          const targetX = this.batter.x - 30;
          const targetY = this.batter.y - 10;
          this.ball.x += (targetX - this.ball.x) * 0.055;
          this.ball.y += (targetY - this.ball.y) * 0.055;
          this.ball.scale = Math.min(1.2, this.ball.scale + 0.015);

          // If ball reaches batter without swinging, auto reset softly
          if (Math.abs(this.ball.x - targetX) < 10) {
            setTimeout(() => this.reset(), 600);
            this.ball.state = 'passed';
          }
        }

        // Ball flying away on hit
        if (this.ball.state === 'hit') {
          this.ball.x += this.ball.vx;
          this.ball.y += this.ball.vy;
          this.ball.scale = Math.max(0.4, this.ball.scale - 0.015);
        }

        // Bat Swing Animation
        if (this.batter.isSwinging) {
          this.batter.swingTimer--;
          this.batter.swingAngle += 0.25;
          if (this.batter.swingTimer <= 0) {
            this.batter.isSwinging = false;
            this.batter.swingAngle = -0.3;
          }
        }
      },

      draw() {
        // Field Diamond
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Dirt infield diamond
        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.5, canvas.height * 0.25);
        ctx.lineTo(canvas.width * 0.85, canvas.height * 0.6);
        ctx.lineTo(canvas.width * 0.5, canvas.height * 0.95);
        ctx.lineTo(canvas.width * 0.15, canvas.height * 0.6);
        ctx.closePath();
        ctx.fill();

        // Home Plate
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.batter.x - 30, this.batter.y, 25, 0, Math.PI * 2);
        ctx.fill();

        // Batter Mascot 🐰
        ctx.save();
        ctx.translate(this.batter.x, this.batter.y);
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath(); ctx.arc(0, -25, 22, 0, Math.PI * 2); ctx.fill(); // Head
        ctx.beginPath(); ctx.ellipse(-10, -50, 6, 18, -0.2, 0, Math.PI * 2); ctx.fill(); // Ear L
        ctx.beginPath(); ctx.ellipse(10, -50, 6, 18, 0.2, 0, Math.PI * 2); ctx.fill(); // Ear R
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(-7, -27, 3, 0, Math.PI * 2); ctx.arc(7, -27, 3, 0, Math.PI * 2); ctx.fill();

        // Bat
        ctx.rotate(this.batter.swingAngle);
        ctx.fillStyle = '#f59e0b';
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(-8, -60, 16, 65, 8); ctx.fill(); ctx.stroke();
        ctx.restore();

        // Baseball
        ctx.save();
        ctx.translate(this.ball.x, this.ball.y);
        ctx.scale(this.ball.scale, this.ball.scale);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, this.ball.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.restore();
      }
    };


    /* ===================================================================
       7. MAIN GAME LOOP & CONTROLLERS
       =================================================================== */
    function startGame(mode) {
      sound.init();
      sound.playWhistle();
      currentMode = mode.toUpperCase();

      homeMenu.classList.add('hidden');
      homeBtn.classList.remove('hidden');
      gameControls.classList.remove('hidden');

      if (currentMode === 'SOCCER') {
        activeGameText.innerText = 'Soccer Goal Striker! ⚽';
        actionIcon.innerText = '⚽';
        actionText.innerText = 'KICK!';
        soccerGame.reset();
      } else if (currentMode === 'FOOTBALL') {
        activeGameText.innerText = 'Football Touchdown Toss! 🏈';
        actionIcon.innerText = '🏈';
        actionText.innerText = 'THROW!';
        footballGame.reset();
      } else if (currentMode === 'BASKETBALL') {
        activeGameText.innerText = 'Basketball Tap Tap Shots! 🏀';
        actionIcon.innerText = '🏀';
        actionText.innerText = 'TAP TO SHOOT!';
        basketballGame.reset();
      } else if (currentMode === 'BASEBALL') {
        activeGameText.innerText = 'Baseball Home Run Hitter! ⚾';
        actionIcon.innerText = '⚾';
        actionText.innerText = 'SWING!';
        baseballGame.reset();
      }
    }

    function returnToMenu() {
      currentMode = 'MENU';
      homeMenu.classList.remove('hidden');
      homeBtn.classList.add('hidden');
      gameControls.classList.add('hidden');
      activeGameText.innerText = 'Super Sports Party! 🌟';
    }

    // Navigation Listeners
    homeBtn.addEventListener('click', () => returnToMenu());

    soundBtn.addEventListener('click', () => {
      sound.init();
      const isMuted = sound.toggleMute();
      soundIcon.innerText = isMuted ? '🔇' : '🔊';
      soundLabel.innerText = isMuted ? 'Muted' : 'Sound ON';
    });

    function triggerAction() {
      sound.init();
      if (currentMode === 'SOCCER') soccerGame.action();
      else if (currentMode === 'FOOTBALL') footballGame.action();
      else if (currentMode === 'BASKETBALL') basketballGame.action();
      else if (currentMode === 'BASEBALL') baseballGame.action();
    }

    // Action button handlers
    btnAction.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      keyState.action = true;
      triggerAction();
    });
    btnAction.addEventListener('pointerup', () => { keyState.action = false; });

    btnLeft.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      keyState.left = true;
      if (currentMode === 'SOCCER') soccerGame.moveLeft();
      else if (currentMode === 'FOOTBALL') footballGame.moveLeft();
      else if (currentMode === 'BASKETBALL') basketballGame.moveLeft();
      else if (currentMode === 'BASEBALL') baseballGame.moveLeft();
    });
    btnLeft.addEventListener('pointerup', () => { keyState.left = false; });

    btnRight.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      keyState.right = true;
      if (currentMode === 'SOCCER') soccerGame.moveRight();
      else if (currentMode === 'FOOTBALL') footballGame.moveRight();
      else if (currentMode === 'BASKETBALL') basketballGame.moveRight();
      else if (currentMode === 'BASEBALL') baseballGame.moveRight();
    });
    btnRight.addEventListener('pointerup', () => { keyState.right = false; });

    // Tap directly on Canvas
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (currentMode !== 'MENU') {
        keyState.action = true;
        triggerAction();
      }
    });
    canvas.addEventListener('pointerup', () => { keyState.action = false; });

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      sound.init();
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') {
        keyState.action = true;
        triggerAction();
      } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keyState.left = true;
        if (currentMode === 'SOCCER') soccerGame.moveLeft();
        else if (currentMode === 'FOOTBALL') footballGame.moveLeft();
        else if (currentMode === 'BASKETBALL') basketballGame.moveLeft();
        else if (currentMode === 'BASEBALL') baseballGame.moveLeft();
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keyState.right = true;
        if (currentMode === 'SOCCER') soccerGame.moveRight();
        else if (currentMode === 'FOOTBALL') footballGame.moveRight();
        else if (currentMode === 'BASKETBALL') basketballGame.moveRight();
        else if (currentMode === 'BASEBALL') baseballGame.moveRight();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') {
        keyState.action = false;
      } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keyState.left = false;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keyState.right = false;
      }
    });

    // Main Loop
    let backgroundAngle = 0;
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentMode === 'SOCCER') {
        soccerGame.update();
        soccerGame.draw();
      } else if (currentMode === 'FOOTBALL') {
        footballGame.update();
        footballGame.draw();
      } else if (currentMode === 'BASKETBALL') {
        basketballGame.update();
        basketballGame.draw();
      } else if (currentMode === 'BASEBALL') {
        baseballGame.update();
        baseballGame.draw();
      } else {
        // MENU Background Animation
        backgroundAngle += 0.01;
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(backgroundAngle);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i = 0; i < 8; i++) {
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-canvas.width, -40, canvas.width * 2, 80);
        }
        ctx.restore();
      }

      updateAndDrawParticles();
      requestAnimationFrame(gameLoop);
    }

    // Start loop and resize canvas when page loads
    window.onload = () => {
      resizeCanvas();
      gameLoop();
    };
  </script>
</body>
